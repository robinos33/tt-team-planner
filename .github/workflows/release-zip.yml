name: Attach plugin ZIP to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-zip:
    name: Build and upload plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        run: |
          git archive --worktree-attributes \
            --prefix=tt-team-planner/ \
            -o tt-team-planner.zip \
            "${GITHUB_REF_NAME}"

      - name: Upload ZIP as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" tt-team-planner.zip --clobber
