name: Attach plugin ZIP to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release à laquelle attacher/remplacer le zip'
        required: true

permissions:
  contents: write

jobs:
  build-zip:
    name: Build and upload plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Determine tag
        id: vars
        run: echo "tag=${{ inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      # Sur `release: published`, checkout résout automatiquement le tag comme
      # ref par défaut. Sur `workflow_dispatch`, le ref déclencheur est une
      # branche (main) : il faut donc pointer explicitement sur le tag pour
      # que git archive trouve l'objet.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Build plugin ZIP
        run: |
          git archive --worktree-attributes \
            --prefix=tt-team-planner/ \
            -o tt-team-planner.zip \
            "${{ steps.vars.outputs.tag }}"

      - name: Upload ZIP as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.vars.outputs.tag }}" tt-team-planner.zip --clobber
