name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à créer (ex. v1.0.4)'
        required: true
      title:
        description: 'Titre de la release (défaut : le tag)'
        required: false
      notes:
        description: 'Notes de release (changelog)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Create tag + GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          title="${RELEASE_TITLE:-$RELEASE_TAG}"
          printf '%s\n' "${RELEASE_NOTES:-Release $RELEASE_TAG.}" > /tmp/notes.md
          gh release create "$RELEASE_TAG" \
            --title "$title" \
            --notes-file /tmp/notes.md \
            --target main
