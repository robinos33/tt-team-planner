name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à créer (ex. v1.0.4)'
        required: true
      title:
        description: 'Titre de la release (défaut : le tag)'
        required: false
      notes:
        description: 'Notes de release (changelog)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Create tag + GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          title="${RELEASE_TITLE:-$RELEASE_TAG}"
          printf '%s\n' "${RELEASE_NOTES:-Release $RELEASE_TAG.}" > /tmp/notes.md
          gh release create "$RELEASE_TAG" \
            --title "$title" \
            --notes-file /tmp/notes.md \
            --target main

      # gh release create utilise GITHUB_TOKEN : ça ne déclenche pas
      # release-zip.yml (GitHub n'enchaîne pas les workflows sur les
      # événements générés par le token par défaut). On construit et
      # on attache donc le zip directement ici, dans le même job.
      - name: Build and attach plugin ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # HEAD est le commit checkouté par actions/checkout ci-dessus (main) :
          # c'est exactement le commit sur lequel `gh release create --target
          # main` vient de poser le tag. On l'utilise plutôt que le nom du tag
          # lui-même, dont l'objet n'a pas été récupéré par ce checkout
          # (shallow, sans les tags nouvellement créés côté serveur).
          git archive --worktree-attributes \
            --prefix=tt-team-planner/ \
            -o tt-team-planner.zip \
            HEAD
          gh release upload "$RELEASE_TAG" tt-team-planner.zip --clobber
